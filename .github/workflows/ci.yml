name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: workhub_ci
          POSTGRES_USER: workhub
          POSTGRES_PASSWORD: workhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workhub -d workhub_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://workhub:workhub@localhost:5432/workhub_ci
      AI_COS_POSTGRES_TEST_URL: postgresql+psycopg://workhub:workhub@localhost:5432/workhub_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: Verify blank PostgreSQL migration
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current
          alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
