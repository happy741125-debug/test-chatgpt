services:
  - type: web
    name: huoda-work-intelligence-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: AI_PROVIDER
        value: rule-based
      - key: EMBEDDED_WORKER_ENABLED
        value: "true"
      - key: CONTEXT_BUFFER_SECONDS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: huoda-work-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: huoda-work-intelligence-queue
          property: connectionString
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REDIRECT_URI
        value: https://huoda-work-intelligence-api.onrender.com/api/gmail/callback
      - key: CREDENTIAL_ENCRYPTION_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        value: https://huoda-work-intelligence-dashboard.onrender.com
      - key: GMAIL_INITIAL_SYNC_DAYS
        value: "7"
      - key: GMAIL_INITIAL_SYNC_LIMIT
        value: "50"
      - key: GMAIL_SYNC_TOKEN
        sync: false
      - key: OPS_API_TOKEN
        generateValue: true
      - key: UPLOAD_API_TOKEN
        generateValue: true

  - type: keyvalue
    name: huoda-work-intelligence-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: huoda-work-intelligence-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    autoDeployTrigger: checksPass
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://huoda-work-intelligence-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: huoda-work-intelligence-db
    plan: free
    region: singapore
    databaseName: huoda_work_intelligence
    user: huoda_work_intelligence
