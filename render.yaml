services:
  - type: web
    name: huoda-work-intelligence-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: huoda-work-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: huoda-work-intelligence-queue
          property: connectionString
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: OPS_API_TOKEN
        generateValue: true

  - type: keyvalue
    name: huoda-work-intelligence-queue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: huoda-work-intelligence-db
    plan: free
    region: singapore
    databaseName: huoda_work_intelligence
    user: huoda_work_intelligence
